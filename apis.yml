aid: devialet
name: Devialet
description: >-
  Devialet is a French high-end audio company founded and headquartered in Paris, known for the
  Phantom active loudspeaker range, the Dione soundbar, the Mania portable speaker, the Gemini
  earbuds, and the Expert Pro amplifier line, and for patented acoustic technologies including
  ADH (Analog Digital Hybrid), SAM (Speaker Active Matching), and the EVO embedded platform. Its
  developer-facing surface is the Devialet IP Control API — an unauthenticated HTTP API served by
  the speakers themselves on the local network under the /ipcontrol/v1 path, introduced with DOS
  2.14 firmware and documented by Devialet as a PDF reference for system integrators. It exposes
  device, system, and group state plus playback, volume, equalizer, night mode, Bluetooth pairing,
  and power and factory-reset commands, with mDNS/DNS-SD discovery. Devialet also ships certified
  home-automation drivers for Crestron and Control4 alongside the raw API.
