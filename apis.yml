apis:
- name: Devialet IP Control API
  description: >-
    Local-network HTTP control API served by Devialet devices themselves. Starting with DOS 2.14
    firmware, Phantom I, Phantom II, Arch, and Dialog expose device, system, and group state plus
    playback, volume, equalizer, night-mode, Bluetooth advertising, and power, restart, and
    factory-reset commands over plain HTTP on port 80 under the /ipcontrol/v1 prefix. Devices are
    discovered with mDNS/DNS-SD (_http._tcp, TXT keys manufacturer=Devialet and
    ipControlVersion=1). No authentication is required. GET queries are guaranteed side-effect
    free; POST commands require a Content-Type of application/json. Application-level errors are
    returned inside an HTTP 200 response as an error object rather than as an HTTP error status.
  humanURL: https://help.devialet.com/hc/en-us/articles/4415207423378-Phantom-s-documentation-for-piloting-them-via-IP
  baseURL: http://192.168.1.20/ipcontrol/v1
  x-deployment: local-network
  x-base-url-note: >-
    This API has no internet-facing host. It is served by the customer's own device on the local
    network, so the base URL is per-device. The value above is the example address used in
    Devialet's own reference documentation; production clients resolve the real address via
    mDNS/DNS-SD and read the path prefix from the service TXT record.
