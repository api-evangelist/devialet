    response: {}
discovery_example:
  summary: mDNS browse output published in the reference documentation
  command: avahi-browse -r _http._tcp
  instances:
    - name: Living room
      hostname: PhantomII98dB-L32Z12345TQ9A.local
      address: 192.168.1.26
      port: 80
      txt:
        path: /
    - name: Living room-ipcontrol
      hostname: PhantomII98dB-L32Z12345TQ9A.local
      address: 192.168.1.26
      port: 80
      txt:
        path: /ipcontrol/v1
        ipControlVersion: '1'
        manufacturer: Devialet
curl_examples:
  - summary: IPv6 link-local call published in the reference documentation
    command: >-
      curl -H 'Content-Type:' -X POST -d '{}' -g -6
      'http://[fe80::525b:c2ff:fe9c:7955%enp0s31f6]:80/ipcontrol/v1/devices/current/identify'
    note: >-
      Devialet uses this to illustrate that link-local IPv6 works from the command line but not in
      browsers. It targets /devices/{deviceId}/identify, which the reference names but never
      specifies — see referenced_but_unspecified in conventions/devialet-conventions.yml.
