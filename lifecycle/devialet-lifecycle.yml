versioning:
  scheme: uri-path
  current: v1
  path_prefix: /ipcontrol/v1
  advertised_in:
    mechanism: mDNS TXT record
    key: ipControlVersion
    value: '1'
  docs: https://help.devialet.com/hc/en-us/articles/4415207423378-Phantom-s-documentation-for-piloting-them-via-IP
  stability_note: >-
    Devialet explicitly reserves the right to change the /ipcontrol/v1 prefix and instructs
    clients to read the advertised `path` TXT key instead of hard-coding it.

release_model:
  gated_by: device firmware (DOS), not an API version header
  description: >-
    Capability availability is a function of the firmware running on the device. Every endpoint,
    and in some cases individual fields and HTTP methods, carries a minimal DOS version. A client
    must read release.version from getDevice to know what a given device supports.
  firmware_families:
    - version: DOS 2.14.x
      introduced_ip_control: true
      capabilities:
        - Support for Phantom I, Phantom II, Dialog, and Arch
        - List available sources and their properties, including accessory sources
        - Select any source
        - Play / Pause / Mute / Unmute / Next / Previous when eligible
        - Volume control
        - Getting the system name
        - Playback status info
        - Stream metadata (artist, album, track) when eligible
    - version: DOS 2.16.x
      capabilities:
        - Support for upcoming Devialet products
        - Launch Bluetooth pairing
        - Night mode setting
        - Equalizer
        - Power off, restart, reset to factory settings

deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  deprecated_operations: []
  note: >-
    No deprecation policy, Sunset/Deprecation header support (RFC 8594), or removal timeline is
    published for the IP Control API, and no operation in Revision 1 is marked deprecated. The
    forward-compatibility contract runs the other way: endpoints added in future revisions return
    404 on older firmware.

sla:
  url: null
  uptime_target: null
  note: >-
    Not applicable in the usual sense. The API is served by the customer's own device on the
    customer's own network; there is no Devialet-operated endpoint whose availability could be
    covered by an SLA. The published operational budget is the 500 ms on-device processing time,
    with a 1000 ms client timeout recommended.

