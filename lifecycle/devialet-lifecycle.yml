known_issues:
  - firmware: DOS 2.14.x
    issue: >-
      availableOperations on getGroupCurrentSource is incorrect for the UPnP source — it lists
      previous/next when they may not be available, and those operations do not work as expected
      for UPnP.
    fixed_in: DOS 2.16.x
  - firmware: DOS 2.14.x
    issue: release.version on getDevice is incorrect.
    fixed_in: DOS 2.16.x
  - firmware: DOS 2.14.x
    issue: The InvalidValue error code is not implemented for invalid numerical values on POST.
    fixed_in: DOS 2.16.x

document_history:
  - revision: 'Revision 1'
    date: '2021-12'
    summary: The initial version, covering DOS 2.14 and upcoming DOS 2.16.

integration_ecosystem:
  home_automation_drivers:
    source: >-
      Phantom Reactor Custom Technical Guide
      (openapi/_original/devialet-phantom-reactor-custom-ci-techguide.pdf)
    available: [Crestron, Control4]
  note: >-
    Devialet ships certified home-automation drivers alongside the raw API. The technical guide
    for the custom-install product states the product is set up "using web interface and/or
    external API commands" and that "all internal status can be monitored via external API
    commands", making IP Control the primary integration contract for that SKU.

