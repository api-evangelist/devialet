    - PyPI (devialet, python-devialet)
  finding: >-
    Devialet publishes no hosted or local MCP server. This is a DERIVED candidate tool surface
    mapped one-to-one onto the operations Devialet documents in its IP Control reference. It is a
    design proposal by API Evangelist, not a Devialet artifact, and nothing here is running.
server:
  name: devialet-ip-control
  transport: stdio
  url: null
  note: >-
    Any real implementation would have to run locally. The IP Control API has no internet host —
    it is served by the customer's speakers on their LAN — so a hosted remote MCP server is not
    possible without a bridge inside the network. A stdio server on the same LAN, performing mDNS
    discovery and holding the resolved device address, is the natural shape.
  required_context:
    - >-
      Device address, resolved via mDNS/DNS-SD (_http._tcp, TXT keys manufacturer=Devialet and
      ipControlVersion=1) or configured as a fixed IP.
    - >-
      Firmware version from getDevice — DOS 2.16 gates the equalizer, night-mode, Bluetooth, and
      power tools.
auth:
  methods: [none]
  note: >-
    The upstream API requires no credentials. An MCP server fronting it should treat LAN
    reachability, not a token, as the trust boundary, and should gate the destructive tools behind
    explicit human confirmation.
