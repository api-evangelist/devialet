implementation_notes:
  - >-
    Every tool's input schema is the backing operation's path parameters plus request body in
    openapi/devialet-ip-control-openapi.yml. Today the only supported identifier value is the
    literal `current`, so most tools take no arguments beyond the device address held by the
    server.
  - >-
    Tools must not treat HTTP 200 as success. The upstream API returns application errors inside a
    200 body as {"error":{"code":...}} — see errors/devialet-error-codes.yml. An MCP server that
    checks only the status code will report failures as successes.
  - >-
    next_group_track and previous_group_track should be gated on availableOperations from
    get_group_current_source, which is the only reliable signal for whether they will work.
  - >-
    There is no power-on tool because the API has no power-on endpoint. Anything that turns a
    device off is one-way over the network.
