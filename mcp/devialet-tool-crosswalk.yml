unbindable:
  description: >-
    Capabilities an agent needs that no documented REST operation provides. These are real gaps in
    the API surface, not mapping failures.
  items:
    - capability: power on a device
      reason: >-
        No endpoint exists. Devialet documents that exiting OFF mode requires pressing a physical
        button on the device. powerOffDevice and powerOffSystem are therefore one-way over the
        network.
    - capability: subscribe to state changes
      reason: >-
        'Asynchronous access to the information (notifications) is not available yet.' Several
        endpoints are annotated NOTIFICATION as a reservation, but Revision 1 ships no event
        channel. Agents must poll.
    - capability: seek within a track
      reason: >-
        `seek` appears in availableOperations on getGroupCurrentSource, but no seek endpoint is
        specified in Revision 1. The reference also names
        /groups/{groupId}/sources/current/playback/position in its polling list without specifying
        it. See referenced_but_unspecified in conventions/devialet-conventions.yml.
    - capability: change group or system membership
      reason: >-
        Grouping and stereo pairing are configured in the Devialet companion app only. The API
        reads groupId and systemId but cannot set them.
    - capability: select an Arch physical input
      reason: Arch input configuration is companion-app only; the API only observes the result.
    - capability: discover devices
      reason: >-
        Discovery is mDNS/DNS-SD, not an HTTP operation. An MCP server must implement it out of
        band before any tool can be called.
