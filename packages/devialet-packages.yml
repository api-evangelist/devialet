summary: >-
  Devialet publishes no first-party client library for the IP Control API in any package registry.
  The GitHub organization github.com/devialet is real and active but contains only forks of
  third-party dependencies (protobuf, googletest, CMake, llvm/clang, tensorflow, curl, nghttp2,
  firebase-ios-sdk, SDWebImage, vsomeip, tinyalsa and similar) vendored for firmware and app
  builds — no SDK, no CLI, and no IP Control client. Every package below is a community
  implementation, listed for completeness and explicitly marked official: false.
