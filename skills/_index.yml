not_covered:
  - area: power and factory reset
    operations:
      - powerOffDevice
      - restartDevice
      - resetDeviceToFactorySettings
      - powerOffSystem
      - restartSystem
      - resetSystemToFactorySettings
    reason: >-
      Deliberately not packaged as an agent skill. There is no power-on endpoint — Devialet
      documents that exiting OFF mode requires pressing a physical button — so powerOff is one-way
      over the network, and the factory-reset operations erase network credentials and can make a
      Wi-Fi-only device permanently unreachable. These belong behind explicit human confirmation,
      not behind an agent skill. Their consequence classification is recorded in
      overlays/devialet-ip-control-overlay.yaml and mcp/devialet-mcp.yml.
  - area: Bluetooth pairing
