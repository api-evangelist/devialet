      skill. Documented in the OpenAPI and exposed as an MCP tool.
cross_cutting_rules:
  - >-
    Application errors are returned with HTTP status 200 and an `error` object in the body. Testing
    only the HTTP status will treat failures as successes. See errors/devialet-error-codes.yml.
  - >-
    POST requests require Content-Type: application/json. Omitting it returns HTTP 415. A
    successful command returns an empty JSON object.
  - >-
    The only supported identifier value in all three namespaces is the literal `current`, resolved
    relative to the device that receives the request.
  - >-
    Capability availability is gated by device firmware (DOS 2.14 vs 2.16), not by an API version.
    Read release.version from getDevice and availableFeatures from getSystem before writing.
  - >-
    There is no event, webhook, or subscription surface. Agents must poll.
  - >-
    No authentication is required, so LAN reachability is the entire trust boundary.
